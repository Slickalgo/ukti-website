<!doctype html>
<!--
  Smart install redirect — ukti.io/get

  Purpose: one short URL that a user can be handed anywhere (QR code on the
  desktop Beat 6, WhatsApp message, printed card) that routes them to the
  right store automatically.

  Device detection happens client-side via navigator.userAgent + navigator.userAgentData:
    - iOS / iPadOS → redirect to App Store
    - Android → redirect to Play Store
    - Anything else (desktop, bot, unknown) → stays on the page and
      shows both store pills + a helpful "open on your phone" note

  Ad attribution (utm_* / fbclid / ct / pt) on the inbound URL is carried across
  the store bounce by get.js — Apple as ct/pt, Google as `referrer`. Without that
  every paid install arrives looking organic.

  The page itself is tiny (no main.css dep, no Tailwind, no framework) so the
  redirect fires fast and the no-JS fallback still works. Store URLs live in
  /config.js, shared with the main site, so this page cannot drift from the hero
  CTAs it backs up. Detection is inlined in get.js rather than pulled from
  /platform.js: this page has no platform-conditional CSS, and the saved
  render-blocking request matters inside an in-app browser on mobile data.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Install Ukti</title>
    <meta name="description" content="Open Ukti on your phone." />
    <meta name="robots" content="noindex" />

    <style>
      :root {
        --paper: #f5f1ea;
        --ink: #0d0b0a;
        --stone: #5f5854;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: ui-serif, Georgia, serif;
        height: 100%;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem 1.5rem;
      }
      main {
        max-width: 28rem;
      }
      h1 {
        font-weight: 500;
        font-size: 2rem;
        line-height: 1.1;
        margin: 0 0 1rem;
      }
      p {
        color: var(--stone);
        font-size: 1.05rem;
        line-height: 1.5;
        margin: 0 0 2rem;
      }
      .pills {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 48px;
        outline: 2px solid transparent;
        outline-offset: 3px;
        transition: outline-color 150ms ease;
      }
      .pill:hover,
      .pill:focus-visible {
        outline-color: var(--ink);
      }
      .pill img {
        display: block;
        height: 48px;
        width: auto;
      }
      .note {
        font-family: ui-monospace, Menlo, monospace;
        text-transform: uppercase;
        font-size: 0.72rem;
        letter-spacing: 0.12em;
        color: var(--stone);
        margin-top: 2rem;
      }
    </style>

    <!-- Device-sniff + redirect. Fires immediately; the fallback UI below shows
         only when the sniff is inconclusive (desktop / bot / private browsing).
         Both files are external because the CSP forbids inline script. -->
    <script src="/config.js"></script>
    <script src="/get.js"></script>
  </head>

  <body>
    <main>
      <h1>Open Ukti on your phone.</h1>
      <p>
        This link opens the App Store or Google Play on your phone. On a
        laptop, pick your store below or scan the code you came from.
      </p>

      <div class="pills">
        <a
          class="pill"
          href="https://apps.apple.com/app/id6782030430"
          rel="noopener"
          aria-label="Download on the App Store"
        >
          <img src="/badges/app-store.svg" alt="" width="144" height="48" />
        </a>
        <a
          class="pill"
          href="https://play.google.com/store/apps/details?id=io.ukti.app"
          rel="noopener"
          aria-label="Get it on Google Play"
        >
          <img src="/badges/google-play.svg" alt="" width="162" height="48" />
        </a>
      </div>

      <p class="note">UKTI · ISSUE №01</p>
    </main>
  </body>
</html>
