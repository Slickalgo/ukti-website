    <title>Ukti — Support</title>
    <meta name="description" content="Product issues: help@ukti.io." />
    <link rel="canonical" href="https://ukti.io/support" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ukti.io/support" />
    <meta property="og:title" content="Ukti — Support" />
    <meta property="og:description" content="Product issues: help@ukti.io." />
    <meta property="og:image" content="https://ukti.io/og-cover.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ukti — Support" />
    <meta name="twitter:description" content="Product issues: help@ukti.io." />
    <meta name="twitter:image" content="https://ukti.io/og-cover.jpg" />

    <script src="/config.js"></script>
  </head>

  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="pt-8 sm:pt-10">
      <div class="mx-auto flex max-w-[1100px] items-center justify-between px-6 sm:px-10">
        <a href="/" class="wordmark text-[18px] sm:text-[20px]">UKTI</a>
        <a href="/" class="eyebrow">← BACK</a>
      </div>
    </header>

    <main
      id="main"
      class="flex items-center justify-center px-6"
      style="min-height: calc(100vh - 160px); min-height: calc(100svh - 160px)"
    >
      <div class="text-center">
        <p
          data-reveal
          class="support-line"
          style="font-size: var(--t-50); line-height: 1.6"
        >
          Product issues:
          <a
            href="mailto:help@ukti.io"
            style="text-decoration: underline; text-decoration-color: rgba(62, 56, 51, 0.4); text-underline-offset: 3px"
            >help@ukti.io</a
          >.<br />
          Replies inside two business days.
        </p>
      </div>
    </main>

    <footer class="bg-paper py-10">
      <div class="mx-auto flex max-w-[1100px] flex-col items-center justify-between gap-4 px-6 sm:flex-row">
        <p class="footer-link">© UKTI 2026</p>
        <nav aria-label="Footer">
          <ul class="flex items-center gap-6">
            <li><a class="footer-link" href="/privacy">PRIVACY</a></li>
            <li><a class="footer-link" href="/terms">TERMS</a></li>
            <li><a class="footer-link" href="/delete-account">DELETE</a></li>
            <li><a class="footer-link" href="/press">PRESS</a></li>
            <li><a class="footer-link" href="/support">SUPPORT</a></li>
          </ul>
        </nav>
      </div>
    </footer>

    <script type="module" src="/src/main.js"></script>
